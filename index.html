<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>라인워치</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e8c">
<style>
  :root{
    --bg:#e9edf1; --card:#ffffff; --card2:#f4f6f8; --line:#dde3e9;
    --blue:#1f4e8c; --blue-bright:#2f6fc4; --text:#1c2530; --text-dim:#6b7684;
    --warn:#d6483f; --amber:#e0a417; --ok:#3f8f5f;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior-y: none; }
  body{ margin:0; padding:10px 10px 96px; background:linear-gradient(180deg,#f7f9fb 0%, var(--bg) 220px);
    overscroll-behavior-y: none;
    color:var(--text); font-family:'Segoe UI','Pretendard',-apple-system,sans-serif; max-width:480px; margin-left:auto; margin-right:auto; }
  .eyebrow{ font-size:.72rem; letter-spacing:.18em; color:var(--blue); text-transform:uppercase; font-weight:800; margin-bottom:4px; }
  h1{ font-size:1.4rem; margin:0; font-weight:800; letter-spacing:-.01em; color:var(--text); }
  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .bottom-tabs{ position:fixed; left:0; right:0; bottom:0; display:flex; background:#fff; border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(30,50,80,.06); z-index:50; padding-bottom:env(safe-area-inset-bottom); max-width:480px; margin:0 auto; }
  .tab-btn{ flex:1; padding:16px 4px 14px; border:0; background:transparent; color:var(--text-dim); font-size:.82rem; font-weight:700; cursor:pointer; }
  .tab-btn.active{ color:var(--blue); font-weight:800; }
  .autocomplete-list{ margin-top:4px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ac-item{ padding:8px 10px; font-size:.82rem; cursor:pointer; border-bottom:1px solid var(--line); background:#fff; }
  .ac-item:last-child{ border-bottom:0; }
  .ac-item.ac-empty{ color:var(--text-dim); cursor:default; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; box-shadow:0 1px 3px rgba(30,50,80,.06); }
  .card h2{ font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:0 0 12px; font-weight:800; }
  .card input{ padding:10px; border:1px solid var(--line); border-radius:8px; }
  .auth-status{ font-size:.8rem; color:var(--text-dim); font-weight:700; }
  .auth-status.on{ color:var(--ok); }

  .sum-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; padding:8px; border-radius:8px; margin-bottom:6px; background:var(--card2); border:1px solid var(--line); }
  .sum-row.urgent{ border-color:rgba(214,72,63,.5); background:rgba(214,72,63,.07); }
  .sum-row.soon{ border-color:rgba(224,164,23,.5); background:rgba(224,164,23,.08); }
  .sum-row.paused{ opacity:.65; border-style:dashed; }
  .sum-left{ flex:1; min-width:0; }
  .sum-product{ font-size:.68rem; color:var(--blue); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px; }
  .sum-left .name{ font-size:.82rem; font-weight:800; overflow-wrap:break-word; }
  .sum-left .kind{ font-size:.68rem; color:var(--text-dim); margin-top:1px; }
  .sum-sub{ font-size:.7rem; color:var(--text-dim); margin-top:3px; padding-left:8px; border-left:2px solid var(--line); flex:1; }
  .sum-sub-row{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .sum-action-btn{ padding:3px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--text-dim); font-size:.66rem; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .sum-action-btn.solid{ background:var(--warn); color:#fff; border-color:var(--warn); }
  .machine-summary-group{ margin-bottom:10px; }
  .machine-summary-header{ padding:10px 12px; border-radius:9px; background:linear-gradient(180deg,#f8fafc,#eef2f6); border:1px solid var(--line); cursor:pointer; font-weight:800; font-size:.82rem; }
  .ms-top-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ms-product-row{ font-size:.74rem; font-weight:700; color:var(--blue); margin-top:3px; overflow-wrap:break-word; }
  .ms-badge{ font-size:.68rem; padding:2px 8px; border-radius:20px; font-weight:700; }
  .ms-badge.urgent{ background:#fce5e5; color:var(--warn); }
  .ms-badge.calm{ background:#e5f2ea; color:var(--ok); }
  .ms-arrow{ font-size:.7rem; color:var(--text-dim); transition:transform .15s; }
  .ms-arrow.open{ transform:rotate(90deg); }
  .machine-summary-body{ display:none; padding-top:7px; }
  .machine-summary-body.open{ display:block; }
  .sum-time{ font-weight:800; font-size:.8rem; text-align:right; white-space:nowrap; flex-shrink:0; letter-spacing:-.01em; }
  .sum-time-label{ font-size:.62rem; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .sum-time.urgent{ color:var(--warn); } .sum-time.soon{ color:#b3820f; } .sum-time.ok{ color:var(--ok); }
  .sum-time.paused{ color:var(--text-dim); font-size:.85rem; }
  .empty-msg{ color:var(--text-dim); font-size:.85rem; text-align:center; padding:10px 0; }

  details.machine{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 3px rgba(30,50,80,.06); }
  details.machine > summary{ list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:1rem; background:linear-gradient(180deg,#f8fafc,#eef2f6); }
  details.machine > summary::-webkit-details-marker{ display:none; }
  .m-name-group{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .m-name-label{ font-weight:800; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pause-icon-btn{ flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--blue); font-size:.85rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pause-icon-btn.is-paused{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .pause-badge{ font-size:.68rem; font-weight:700; color:#8a6d1a; background:#fbeecb; border:1px solid #f0d998; border-radius:20px; padding:2px 8px; white-space:nowrap; }
  .arrow{ color:var(--text-dim); font-size:.8rem; transition:transform .15s; margin-left:8px; flex-shrink:0; }
  details.machine[open] > summary .arrow{ transform:rotate(90deg); }
  .machine-body{ padding:8px 10px 10px; background:var(--card); }

  .product-header{ padding:10px 12px; background:#f9fafb; border-radius:8px; margin-bottom:12px; border:1px solid var(--line); }
  .product-title{ font-weight:800; font-size:.95rem; margin-bottom:2px; }
  .product-status{ font-size:.72rem; color:var(--text-dim); }
  .product-progress{ font-size:.74rem; color:var(--blue); font-weight:700; margin-top:4px; }

  .section-label{ font-size:.74rem; color:var(--text-dim); margin:10px 0 7px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .item-btn{ padding:8px; border-radius:8px; border:1.5px solid; cursor:pointer; background:#e5edf9; border-color:#2f6fc4; text-align:center; }
  .item-btn.soon{ background:#fef8e6; border-color:var(--amber); }
  .item-btn.urgent{ background:#fce5e5; border-color:var(--warn); }
  .item-btn-name{ font-size:.85rem; font-weight:700; color:var(--text); margin-bottom:4px; }
  .item-btn-info{ font-size:.72rem; color:var(--text-dim); line-height:1.3; }
  .item-btn.urgent .item-btn-info{ color:var(--warn); font-weight:600; }
  .item-btn.soon .item-btn-info{ color:#b3820f; font-weight:600; }

  .btn-add{ background:transparent; color:var(--blue); border:1.5px dashed var(--blue); border-radius:9px; padding:8px; width:100%; font-weight:800; cursor:pointer; font-size:.82rem; margin-bottom:8px;}
  .btn{ padding:8px; border:0; border-radius:8px; font-weight:800; cursor:pointer; font-size:.82rem; }
  .btn-blue{ background:linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff; width:100%; }
  .btn-ghost{ background:#fff; color:var(--text-dim); border:1px solid var(--line); }
  .card-footer-actions{ display:flex; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); justify-content:flex-end; flex-wrap:wrap; }
  .mini-btn{ padding:5px 9px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--text-dim); font-size:.72rem; font-weight:700; cursor:pointer; }
  .mini-btn-warn{ color:var(--warn); border-color:rgba(214,72,63,.35); }

  .modal-overlay{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--card); border-radius:12px; width:90%; max-width:340px; max-height:85vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .modal-header{ background:linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff; padding:14px 16px; font-weight:700; font-size:.9rem; border-radius:12px 12px 0 0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .modal-close-x{ flex-shrink:0; width:26px; height:26px; border-radius:50%; border:0; background:rgba(255,255,255,.2); color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-body{ padding:16px; }
  .input-group{ margin-bottom:12px; }
  .input-label{ display:block; font-size:.72rem; color:var(--text-dim); margin-bottom:4px; font-weight:800; letter-spacing:.03em; }
  input[type=number], input[type=text], select{ width:100%; padding:10px; background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:.92rem; }
  input:focus, select:focus{ outline:none; border-color:var(--blue); }
  .result-box{ background:#e5edf9; padding:10px; border-radius:8px; margin:10px 0; font-size:.75rem; color:var(--blue); font-weight:700; line-height:1.5; }
  .preview-hint{ font-size:.72rem; color:var(--blue); font-weight:700; margin-top:5px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .preview-apply-btn{ padding:3px 9px; border-radius:6px; border:1px solid var(--blue); background:#fff; color:var(--blue); font-size:.66rem; font-weight:700; cursor:pointer; white-space:nowrap; }
  .preview-apply-btn:disabled{ opacity:.35; cursor:default; }
  .lot-box{ background:#e5edf9; border-radius:10px; padding:12px; margin-top:14px; }
  .lot-box .section-label{ color:var(--blue); margin-top:0; }
  .action-row-compact{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .btn-compact{ padding:7px 11px; border-radius:8px; font-weight:800; font-size:.78rem; cursor:pointer; border:1.5px dashed var(--blue); background:transparent; color:var(--blue); white-space:nowrap; }
  .btn-compact.solid{ border-style:solid; border-color:var(--blue); background:linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff; }
  .modal-buttons{ display:flex; gap:8px; margin-top:12px; }
  .modal-buttons .btn{ flex:1; padding:10px; }
  .history-list{ margin-top:10px; max-height:200px; overflow-y:auto; }
  .history-item{ padding:8px; background:var(--card2); border-radius:6px; margin-bottom:6px; font-size:.75rem; display:flex; justify-content:space-between; align-items:center; }
  .history-text{ flex:1; }
  .history-actions{ display:flex; gap:4px; }
  .history-btn{ padding:2px 6px; font-size:.65rem; border:0; border-radius:4px; cursor:pointer; background:transparent; color:var(--text-dim); }
  .preset-item{ padding:12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .preset-item:hover{ border-color:var(--blue); }
  .preset-name{ font-weight:800; font-size:.85rem; }
  .preset-sub{ font-size:.7rem; color:var(--text-dim); margin-top:2px; }
  .btn-hint{ font-size:.68rem; color:var(--text-dim); text-align:center; margin-top:4px; }
  .completed-product{ background:var(--card2); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .completed-product summary{ list-style:none; cursor:pointer; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.82rem; font-weight:700; }
  .completed-product summary::-webkit-details-marker{ display:none; }
  .completed-meta{ font-size:.7rem; color:var(--text-dim); font-weight:600; white-space:nowrap; }
  .completed-body{ padding:0 12px 10px; }
  @media (min-width: 768px){
    .modal{ max-width:440px; }
    body{ max-width:900px; padding:24px 28px 100px; }
    .bottom-tabs{ max-width:900px; }
    .tab-btn{ font-size:.9rem; padding:18px 4px 16px; }
    #machines-container{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
    #machines-container details.machine{ margin-bottom:0; }
    #summary-list{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
    #summary-list .machine-summary-group{ margin-bottom:0; }
    .item-grid{ grid-template-columns:repeat(3, 1fr); }
    .row2{ grid-template-columns:1fr 1fr; }
    h1{ font-size:1.7rem; }
    .card, .machine-body{ padding:16px; }
    .sum-row{ padding:11px; }
  }
  @media (min-width: 1100px){
    body{ max-width:1140px; }
    #machines-container{ grid-template-columns:1fr 1fr 1fr; }
    #summary-list{ grid-template-columns:1fr 1fr 1fr; }
    .item-grid{ grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <div class="header-row">
    <div>
      <div class="eyebrow">Production Line Monitor</div>
      <h1>라인워치</h1>
    </div>
  </div>

  <!-- ===== 생산 페이지 ===== -->
  <div class="page" id="page-production">
    <div class="card">
      <h2>지금 확인할 순서</h2>
      <div id="summary-list"><div class="empty-msg">기계와 제품을 추가하고 계산하면 여기에 표시됩니다</div></div>
    </div>

    <div id="machines-container"></div>
    <button class="btn-add" id="add-machine">+ 기계 추가</button>
  </div>

  <!-- ===== 이력 페이지 ===== -->
  <div class="page" id="page-history" style="display:none;">
    <div class="card">
      <h2>이력 조회</h2>
      <div class="row2">
        <div class="input-group"><label class="input-label">기계</label><select id="histFilterMachine"><option value="">전체</option></select></div>
        <div class="input-group"><label class="input-label">구분</label>
          <select id="histFilterType">
            <option value="">전체</option>
            <option value="lot">로트 완료</option>
            <option value="replace">자재 교체</option>
            <option value="end">생산 종료</option>
          </select>
        </div>
      </div>
      <div class="input-group"><label class="input-label">날짜</label><input type="date" id="histFilterDate"></div>
      <button class="btn btn-ghost" id="histClearFilter" style="width:100%;">필터 초기화</button>
    </div>
    <div class="card">
      <div id="historyList"><div class="empty-msg">이력이 없습니다</div></div>
    </div>
  </div>

  <!-- ===== 등록 페이지 ===== -->
  <div class="page" id="page-register" style="display:none;">
    <div class="card" id="auth-logged-out" style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="email" id="login-email" placeholder="이메일" style="flex:1; min-width:100px;">
      <input type="password" id="login-pw" placeholder="비밀번호" style="flex:1; min-width:100px;">
      <button class="btn btn-blue" id="login-btn" style="width:auto; padding:10px 16px;">로그인</button>
    </div>
    <div class="card" id="auth-logged-in" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="auth-status on">✓ 입력 가능 모드</span>
        <button class="btn btn-ghost" id="logout-btn" style="width:auto; padding:8px 14px;">로그아웃</button>
      </div>
      <button class="btn-add" id="dailyCloseBtn" style="margin:0 0 12px; border-color:var(--amber); color:#b3820f;">🗓 일일 마감 (오늘 기록 스냅샷)</button>
      <div class="section-label" style="margin-top:0;">등록</div>
      <div class="row2" style="margin-bottom:8px;">
        <button class="btn-add" id="addMaterialBtn" style="margin:0;">+ 자재 추가</button>
        <button class="btn-add" id="addPresetBtn" style="margin:0;">+ 제품 추가</button>
      </div>
      <button class="btn-add" id="uploadPresetBtn" style="margin:0;">📤 대량 업로드 (엑셀/CSV)</button>
      <input type="file" id="presetFileInput" accept=".xlsx,.xls,.csv" style="display:none;">
    </div>

    <details class="card" style="padding:0;">
      <summary style="padding:16px; cursor:pointer; list-style:none; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:800;">자재 라이브러리</summary>
      <div style="padding:0 16px 16px;">
        <div class="action-row-compact" id="matLibFilterRow" style="margin-bottom:8px;">
          <button class="btn-compact solid" data-filter="" onclick="setMatLibFilter('')">전체</button>
          <button class="btn-compact" data-filter="roll" onclick="setMatLibFilter('roll')">원단롤</button>
          <button class="btn-compact" data-filter="container" onclick="setMatLibFilter('container')">점착제통</button>
          <button class="btn-compact" data-filter="other" onclick="setMatLibFilter('other')">기타</button>
        </div>
        <div id="materialLibraryList"><div class="empty-msg">등록된 자재 없음</div></div>
      </div>
    </details>

    <details class="card" style="padding:0;">
      <summary style="padding:16px; cursor:pointer; list-style:none; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:800;">제품 라이브러리 (프리셋)</summary>
      <div style="padding:0 16px 16px;" id="presetLibraryList"><div class="empty-msg">등록된 프리셋 없음</div></div>
    </details>

    <details class="card" style="padding:0;">
      <summary style="padding:16px; cursor:pointer; list-style:none; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:800;">일일 마감 기록</summary>
      <div style="padding:0 16px 16px;" id="dailyClosuresList"><div class="empty-msg">아직 마감 기록 없음</div></div>
    </details>
  </div>

  <!-- ===== 계산기 페이지 ===== -->
  <div class="page" id="page-calc" style="display:none;">
    <div class="card">
      <h2>재고 원단 잔량 계산기</h2>
      <div class="input-group">
        <label class="input-label">지관 크기</label>
        <div class="row2">
          <button class="btn btn-blue" id="calcCore103" style="padding:10px;">103mm</button>
          <button class="btn btn-ghost" id="calcCore182" style="padding:10px;">182mm</button>
        </div>
      </div>
      <div class="row2">
        <div class="input-group"><label class="input-label">원단 두께 (µm)</label><input type="number" id="calcT" placeholder="예: 12" oninput="runCalc()"></div>
        <div class="input-group"><label class="input-label">쌓인 두께 H (mm)</label><input type="number" id="calcH" placeholder="실측값" oninput="runCalc()"></div>
      </div>
      <div class="result-box" id="calcResult" style="font-size:1rem; text-align:center; padding:16px;">예상 잔량: –</div>
    </div>
  </div>

  <div class="bottom-tabs">
    <button class="tab-btn active" data-page="production">🏭 생산</button>
    <button class="tab-btn" data-page="history">📋 이력</button>
    <button class="tab-btn" data-page="register">⚙️ 등록</button>
    <button class="tab-btn" data-page="calc">🧮 계산기</button>
  </div>

  <!-- 신규 제품 모달 -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header"><span>신규 제품 추가</span><button class="modal-close-x" onclick="closeModal('productModal')">✕</button></div>
      <div class="modal-body" id="productModalBody"></div>
    </div>
  </div>

  <!-- 항목 추가 모달 -->
  <div class="modal-overlay" id="addItemModal">
    <div class="modal">
      <div class="modal-header"><span>항목 추가</span><button class="modal-close-x" onclick="closeModal('addItemModal')">✕</button></div>
      <div class="modal-body">
        <div class="section-label">자주 쓰는 이름</div>
        <div class="item-grid" id="presetItemGrid" style="grid-template-columns:1fr 1fr;"></div>

function migrateState(s){
  if(!s || !s.machines) return { machines:[], presets:[], dailyClosures:[], materialLibrary:[] };
  if(!s.presets) s.presets = [];
  if(!s.dailyClosures) s.dailyClosures = [];

    if(m.pausedAt===undefined) m.pausedAt=null;
    if(m.lotCode===undefined) m.lotCode='';
    m.products.forEach(p=>{ if(p.targetQty===undefined) p.targetQty=null; });

}

  const isCsv = file.name.toLowerCase().endsWith('.csv');
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = isCsv
        ? XLSX.read(evt.target.result, { type:'string' })
        : XLSX.read(evt.target.result, { type:'array' });
      const sheetName = wb.SheetNames.includes('프리셋') ? '프리셋' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:'' });
      const grouped = {};
      rows.forEach(row=>{
        const name = String(row['제품명']||'').trim();
        if(!name) return;
        if(!grouped[name]) grouped[name] = [];
        grouped[name].push({
          position: String(row['위치']||'').trim(),
          materialName: String(row['자재명']||'').trim(),
          type: String(row['타입']||'').trim(),

          core_mm: parseFloat(row['지관크기(mm)']) || null,
          L_total: parseFloat(row['초기총길이(m)']) || null,
        });
      });
      if(Object.keys(grouped).length === 0){
        alert('인식된 행이 없습니다. 파일의 컬럼명이 양식과 일치하는지 확인해주세요.');
        e.target.value = '';
        return;
      }
      let addedCount = 0, updatedCount = 0;
      Object.keys(grouped).forEach(name=>{
        const existing = state.presets.find(p=>p.name===name);
        if(existing){ existing.materials = grouped[name]; updatedCount++; }
        else{ state.presets.push({ id:uid('preset'), name, materials:grouped[name] }); addedCount++; }
      });
      let libAdded = 0, libUpdated = 0;
      rows.forEach(row=>{

        if(!mname) return;
        const type = typeFromKo(String(row['타입']||'').trim());

      });
      saveState();
      alert(`프리셋 업로드 완료: 제품 신규 ${addedCount}개/갱신 ${updatedCount}개, 자재 라이브러리 신규 ${libAdded}개/갱신 ${libUpdated}개`);
      e.target.value = '';

      alert('업로드 실패: 파일 형식을 확인해주세요.\n'+err.message);

});

function findMachine(mid){ return state.machines.find(m=>m.id===mid); }
function findProduct(mid, pid){ return findMachine(mid).products.find(p=>p.id===pid); }
function findItem(mid, pid, iid){ return findProduct(mid, pid).items.find(i=>i.id===iid); }
function nowFor(m){ return (m && m.paused && m.pausedAt) ? m.pausedAt : Date.now(); }

function rollRemainingM(core_mm, t_um, H){
  if(!(t_um>0) || !(H>=0) || !(core_mm>0)) return null;
  const t_mm = t_um/1000, r0 = core_mm/2, R = r0+H;
  return Math.PI*(Math.pow(R,2)-Math.pow(r0,2)) / t_mm / 1000;
}
function H_fromLength(core_mm, t_um, L){
  if(!(t_um>0) || !(L>=0) || !(core_mm>0)) return null;
  const t_mm = t_um/1000, r0 = core_mm/2;
  const area = L*1000*t_mm;
  const R = Math.sqrt(r0*r0 + area/Math.PI);
  return R - r0;
}
function fmtM(v){ return v==null ? '–' : v.toLocaleString(undefined,{maximumFractionDigits:1})+' m'; }
function liveRemainM(it, refNow, speed){
  if(it.rollTarget==null || !(speed>0)) return null;
  return Math.max(0, (it.rollTarget-refNow)/60000*speed);
}
function fmtCountdown(targetMs, refNow, paused){
  refNow = refNow ?? Date.now();
  const diff = targetMs - refNow;
  const past = diff <= 0;
  const abs = Math.abs(diff);
  const totalSec = Math.floor(abs/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60);
  const sstr = h>0 ? `${h}시간 ${m}분` : `${m}분`;
  if(paused) return { text:'⏸ '+(past?'0분':sstr)+' 남음', tier:'paused' };
  let tier = past ? 'urgent' : (diff < 10*60000 ? 'urgent' : (diff < 30*60000 ? 'soon' : 'ok'));
  return { text: past ? '지금 확인!' : sstr+' 후', tier };
}
function distanceToCheckpoint(it, H_cp){
  if(!(H_cp>=0) || H_cp >= it.H) return null;
  const t_mm = it.t_um/1000, r0 = it.core_mm/2;
  const R = r0+it.H, R_cp = r0+H_cp;
  return Math.PI*(Math.pow(R,2)-Math.pow(R_cp,2)) / t_mm / 1000;
}
function recomputeCheckpoints(it, speed){
  const now = Date.now();
  it.checkpoints.forEach(cp=>{
    const dist = distanceToCheckpoint(it, cp.H_cp);
    if(dist===null){ cp.target=now; cp.distM=null; cp.invalid=true; }
    else{ cp.target = now + (dist/speed)*60000; cp.distM=dist; cp.invalid=false; }
  });
}
function pad2(n){ return String(n).padStart(2,'0'); }
function todayYYMMDD(){
  const d = new Date();
  return String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
}
function autoLotCode(m){
  if(m.lotCode) return m.lotCode;
  const match = String(m.no||'').match(/\d+/);
  return match ? 'C'+match[0] : '';
}
function nextLotNumber(m){
  const ymd = todayYYMMDD();
  const prefix = autoLotCode(m) + ymd + '-';
  let count = 0;
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  m.products.forEach(p=>p.histories.forEach(h=>{
    if(h.type==='lot' && h.time >= startOfDay.getTime()) count++;
  }));
  return prefix + pad2(count+1);
}

    });
  });
  if(typeFilter) entries = entries.filter(h=>h.type===typeFilter);

      return ds===dateFilter;
    });

  entries.sort((a,b)=>b.time-a.time);
  if(!entries.length){ el.innerHTML = '<div class="empty-msg">해당 조건의 이력이 없습니다</div>'; return; }

function renderCpListInModal(it, mid, pid){
  const m = findMachine(mid);
  const p = findProduct(mid, pid);
  const refNow = nowFor(m);
  if(!it.checkpoints.length) return '<div class="empty-msg" style="font-size:.75rem;">체크포인트 없음</div>';
  const sorted = it.checkpoints.slice().map(cp=>{
    const liveDist = cp.invalid ? null : Math.max(0, (cp.target-refNow)/60000*p.speed);
    return { cp, liveDist };
  }).sort((a,b)=>{
    if(a.liveDist==null) return 1;
    if(b.liveDist==null) return -1;
    return a.liveDist - b.liveDist;
  });
  return sorted.map(({cp, liveDist})=>{
    const {text} = fmtCountdown(cp.target, refNow, m.paused);
    const distText = cp.invalid ? '확인 필요' : (liveDist!=null ? `약 ${liveDist.toLocaleString(undefined,{maximumFractionDigits:0})}m 남음` : '–');
    return `<div class="history-item">
      <div class="history-text"><strong>${cp.label}</strong><br>H ${cp.H_cp}mm · ${distText} · ${text}</div>
      <div class="history-actions">
        <button class="history-btn" data-act="editcp" data-m="${mid}" data-p="${pid}" data-i="${it.id}" data-cp="${cp.id}">수정</button>
        <button class="history-btn" data-act="delcp" data-m="${mid}" data-p="${pid}" data-i="${it.id}" data-cp="${cp.id}">삭제</button>
      </div>
    </div>`;
  }).join('');
}

let summaryOverride = {}; // mid -> true(open)/false(closed), only set once user manually toggles

function renderSummary(){
  const machineGroups = [];
  state.machines.forEach(m=>{
    const itemGroups = [];
    m.products.filter(p=>p.active).forEach(p=>{
      const refNow = nowFor(m);
      p.items.forEach(it=>{
        const product = p.name, label = it.label;
        if(it.type==='roll'){
          if(!it.rollTarget) return;
          const liveM = liveRemainM(it, refNow, p.speed);
          const subs = [{ target:it.rollTarget, kind:'롤 교체', dist:liveM, invalid:false, isRoll:true, pid:p.id, iid:it.id }];
          it.checkpoints.forEach(cp=>{
            const liveD = cp.invalid ? null : Math.max(0, (cp.target-refNow)/60000*p.speed);
            subs.push({ target:cp.target, kind:cp.label, dist:liveD, invalid:cp.invalid, isCp:true, pid:p.id, iid:it.id, cpId:cp.id });
          });
          subs.sort((a,b)=>a.target-b.target);
          itemGroups.push({ product, label, primary:subs[0], secondary:subs.slice(1) });
        }else if(it.type==='container'){
          if(!it.target) return;
          itemGroups.push({ product, label, primary:{ target:it.target, kind:'약품 교체', dist:null, invalid:false, isContainer:true, pid:p.id, iid:it.id }, secondary:[] });
        }
      });
    });
    if(itemGroups.length){
      itemGroups.sort((a,b)=>a.primary.target-b.primary.target);
      machineGroups.push({ m, itemGroups });
    }
  });
  machineGroups.sort((a,b)=> a.itemGroups[0].primary.target - b.itemGroups[0].primary.target);

  const el = $('summary-list');
  if(!machineGroups.length){ el.innerHTML = '<div class="empty-msg">기계와 제품을 추가하고 계산하면 여기에 표시됩니다</div>'; return; }

  function distStr(dist){ return dist!=null ? ` · 약 ${dist.toLocaleString(undefined,{maximumFractionDigits:0})}m 남음` : ''; }
  function timeOf(sub, refNow, paused){
    let {text,tier} = fmtCountdown(sub.target, refNow, paused);
    if(sub.invalid && !paused){ text='확인 필요'; tier='urgent'; }
    return {text, tier};
  }
  function actionBtnHTML(sub, mid){
    if(sub.isCp) return `<button class="sum-action-btn" data-act="quickdelcp" data-m="${mid}" data-p="${sub.pid}" data-i="${sub.iid}" data-cp="${sub.cpId}">✓</button>`;
    if(sub.isRoll || sub.isContainer) return `<button class="sum-action-btn solid" data-act="openitemreplace" data-m="${mid}" data-p="${sub.pid}" data-i="${sub.iid}">교체</button>`;
    return '';
  }

  el.innerHTML = machineGroups.map(({m, itemGroups})=>{
    const refNow = nowFor(m);
    let urgentCount=0, soonCount=0;
    itemGroups.forEach(g=>{
      [g.primary, ...g.secondary].forEach(s=>{
        const t = timeOf(s, refNow, m.paused).tier;
        if(t==='urgent') urgentCount++; else if(t==='soon') soonCount++;
      });
    });
    const hasUrgent = urgentCount>0;
    const isOpen = summaryOverride.hasOwnProperty(m.id) ? summaryOverride[m.id] : hasUrgent;
    const badge = hasUrgent ? `<span class="ms-badge urgent">긴급 ${urgentCount}건</span>`
      : soonCount>0 ? `<span class="ms-badge urgent" style="background:#fef3e2; color:#b3820f;">곧 ${soonCount}건</span>`
      : `<span class="ms-badge calm">여유</span>`;
    const productNames = [...new Set(itemGroups.map(g=>g.product))];

    const groupsHTML = itemGroups.map(g=>{
      const pt = timeOf(g.primary, refNow, m.paused);
      const tierClass = pt.tier==='urgent'?'urgent':(pt.tier==='soon'?'soon':(pt.tier==='paused'?'paused':''));
      const primaryAction = actionBtnHTML(g.primary, m.id);
      const secondaryHTML = g.secondary.map(s=>{
        const st = timeOf(s, refNow, m.paused);
        return `<div class="sum-sub-row">
          <div class="sum-sub">↳ ${s.kind}${distStr(s.dist)} · ${st.text}</div>
          ${actionBtnHTML(s, m.id)}
        </div>`;
      }).join('');
      return `<div class="sum-row ${tierClass}">
        <div class="sum-left">
          <div class="name">${g.label}</div>
          <div class="kind">${g.primary.kind}${distStr(g.primary.dist)}</div>
          ${secondaryHTML}
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <div class="sum-time-label">예정</div>
          <div class="sum-time ${pt.tier}">${pt.text}</div>
          ${primaryAction}
        </div>
      </div>`;
    }).join('');

    return `<div class="machine-summary-group">
      <div class="machine-summary-header" data-act="togglesummarymachine" data-m="${m.id}">
        <div class="ms-top-row">
          <span>${m.no}</span>
          <span style="display:flex; align-items:center; gap:6px;">
            ${badge}
            <span class="ms-arrow ${isOpen?'open':''}">▶</span>
          </span>
        </div>
        ${productNames.length ? `<div class="ms-product-row">${productNames.join(', ')}</div>` : ''}
      </div>
      <div class="machine-summary-body ${isOpen?'open':''}">${groupsHTML}</div>
    </div>`;
  }).join('');
}

function computeDailySnapshot(){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  const perMachine = state.machines.map(m=>{
    let lots=0, lotTotal=0, replacements=0;
    m.products.forEach(p=>p.histories.forEach(h=>{
      if(h.time>=startOfDay.getTime()){
        if(h.type==='lot'){ lots++; const n=parseFloat(h.amount); if(!isNaN(n)) lotTotal+=n; }
        if(h.type==='replace') replacements++;
      }
    }));
    return { mid:m.id, no:m.no, lots, lotTotal, replacements };
  });
  return { id:uid('dc'), time:Date.now(), perMachine };
}
function entriesForDay(timestamp){
  const d = new Date(timestamp);
  const ds = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const entries = [];
  state.machines.forEach(m=>{
    m.products.forEach(p=>{
      p.histories.forEach(h=>{
        const hd = new Date(h.time);
        const hds = `${hd.getFullYear()}-${pad2(hd.getMonth()+1)}-${pad2(hd.getDate())}`;
        if(hds===ds) entries.push(Object.assign({}, h, { machineName:m.no, productName:p.name }));
      });
    });
  });
  entries.sort((a,b)=>a.time-b.time);
  return entries;
}
function renderDailyClosures(){
  const el = $('dailyClosuresList');
  if(!el) return;
  const list = (state.dailyClosures||[]).slice().reverse().slice(0,10);
  if(!list.length){ el.innerHTML = '<div class="empty-msg">아직 마감 기록 없음</div>'; return; }
  el.innerHTML = list.map(dc=>{
    const dateStr = new Date(dc.time).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const lines = dc.perMachine.filter(pm=>pm.lots>0||pm.replacements>0).map(pm=>`${pm.no}: 로트${pm.lots}건(${pm.lotTotal.toLocaleString()}m)·교체${pm.replacements}건`).join('<br>');
    const detailEntries = entriesForDay(dc.time);
    const detailHtml = detailEntries.length ? detailEntries.map(h=>{
      const typeLabel = h.type==='lot' ? '로트 완료' : h.type==='replace' ? '자재 교체' : '생산 종료';
      return `<div class="history-item"><div class="history-text"><strong>${h.machineName} · ${h.productName}</strong><br>${typeLabel}${h.lotNumber?' · '+h.lotNumber:''}${h.amount?' · '+h.amount:''} · ${new Date(h.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
    }).join('') : '<div class="empty-msg" style="font-size:.72rem;">세부 이력 없음</div>';
    return `<details class="completed-product">
      <summary><span>${dateStr}</span><span class="completed-meta">${lines||'활동 없음'}</span></summary>
      <div class="completed-body">${detailHtml}</div>
    </details>`;
  }).join('');
}
$('dailyCloseBtn').addEventListener('click', ()=>{
  if(!confirm('오늘 기록을 마감하시겠습니까? (진행 중인 작업은 계속됩니다)')) return;

      <button class="btn btn-ghost" onclick="closeModal('productModal')">취소</button>
    </div>

// ---- 자재 라이브러리 ----
let matLibFilter = '';
function setMatLibFilter(type){
  matLibFilter = type;
  document.querySelectorAll('#matLibFilterRow .btn-compact').forEach(b=>{
    b.className = 'btn-compact' + (b.dataset.filter===type ? ' solid' : '');
  });
  renderMaterialLibrary();
}
function renderMaterialLibrary(){
  const el = $('materialLibraryList');
  if(!el) return;
  const list = matLibFilter ? state.materialLibrary.filter(m=>m.type===matLibFilter) : state.materialLibrary;
  if(!list.length){ el.innerHTML = `<div class="empty-msg">${matLibFilter ? '해당 타입의 자재 없음' : '등록된 자재 없음'}</div>`; return; }
  el.innerHTML = list.map(mat=>`
    <div class="history-item">
      <div class="history-text"><strong>${mat.name}</strong> · ${TYPE_KO[mat.type]||mat.type}<br>${mat.type==='roll'?`두께 ${mat.t_um??'–'}µm · 지관 ${mat.core_mm??'–'}mm · ${mat.L_total??'–'}m`:''}</div>
      <div class="history-actions">
        <button class="history-btn" data-act="editmaterial" data-mat="${mat.id}">수정</button>
        <button class="history-btn" data-act="delmaterial" data-mat="${mat.id}">삭제</button>
      </div>
    </div>`).join('');
}

function renderPresetLibrary(){
  const el = $('presetLibraryList');
  if(!el) return;
  if(!state.presets.length){ el.innerHTML = '<div class="empty-msg">등록된 프리셋 없음</div>'; return; }
  el.innerHTML = state.presets.map(preset=>`
    <div class="history-item">
      <div class="history-text"><strong>${preset.name}</strong><br>${preset.materials.map(mt=>mt.position).join('·')} · ${preset.materials.length}개 항목</div>
      <div class="history-actions">
        <button class="history-btn" data-act="editpreset" data-preset="${preset.id}">수정</button>
        <button class="history-btn" data-act="delpreset" data-preset="${preset.id}">삭제</button>
      </div>
    </div>`).join('');
}

      <label class="input-label">타입</label>

      <label class="input-label">지관 크기</label>

        <button class="btn btn-blue" id="newMatCore103" style="padding:8px;">103mm</button>

    <button class="btn btn-blue" id="saveMaterialBtn" style="width:100%; margin-top:6px;">저장</button>

    $('newMatTypeRoll').className = 'btn ' + (selType==='roll'?'btn-blue':'btn-ghost');
    $('newMatTypeContainer').className = 'btn ' + (selType==='container'?'btn-blue':'btn-ghost');
    $('newMatTypeOther').className = 'btn ' + (selType==='other'?'btn-blue':'btn-ghost');
    $('newMatRollFields').style.display = selType==='roll' ? 'grid' : 'none';

// ---- 제품 프리셋 개별 등록 (자재 라이브러리에서 골라 구성) ----
let presetSlotSelections = {};
function renderPresetBuilderModal(editId, templateData){
  presetSlotSelections = {};
  const existingPreset = editId ? state.presets.find(p=>p.id===editId) : null;
  const seedPreset = existingPreset || templateData || null;
  const slotsHtml = ITEM_PRESETS.map((slot, idx)=>{
    const seedMat = seedPreset ? seedPreset.materials.find(mt=>mt.position===slot.label) : null;
    if(seedMat){
      const libMatch = state.materialLibrary.find(m=>m.name===seedMat.materialName && m.type===slot.type);
      if(libMatch) presetSlotSelections[idx] = { matId: libMatch.id };
    }
    return `
      <div class="input-group">
        <label class="input-label">${slot.label} (${TYPE_KO[slot.type]})</label>
        <input type="text" id="slotSearch_${idx}" placeholder="자재명 검색 또는 직접 입력" autocomplete="off" oninput="onSlotSearch(${idx})" value="${seedMat?seedMat.materialName:''}">
        <div class="autocomplete-list" id="slotResults_${idx}"></div>
      </div>`;
  }).join('');
  $('presetBuilderModalBody').innerHTML = `
    <div class="input-group">
      <label class="input-label">제품명</label>
      <input type="text" id="newPresetName" placeholder="예: 700G FOAM" value="${seedPreset?seedPreset.name:''}" autocomplete="off" oninput="onNewPresetNameSearch()">
      <div class="autocomplete-list" id="newPresetNameResults"></div>
    </div>
    ${templateData && !existingPreset ? `<div class="btn-hint" style="text-align:left; color:var(--blue);">"${templateData.name}" 구성을 참고해서 채웠습니다 — 이름을 바꾸면 새 프리셋으로 저장됩니다</div>` : ''}
    <div class="section-label">위치별 자재 선택</div>
    ${slotsHtml}
    <button class="btn btn-blue" id="savePresetBtn" style="width:100%; margin-top:8px;">저장</button>
  `;
  $('savePresetBtn').onclick = ()=>{
    const name = $('newPresetName').value.trim();
    if(!name){ alert('제품명을 입력하세요.'); return; }
    const materials = [];
    ITEM_PRESETS.forEach((slot, idx)=>{
      const sel = presetSlotSelections[idx];
      const typedText = $(`slotSearch_${idx}`).value.trim();
      if(sel && sel.matId){
        const mat = state.materialLibrary.find(m=>m.id===sel.matId);
        if(mat) materials.push({ position:slot.label, materialName:mat.name, type:TYPE_KO[mat.type], t_um:mat.t_um, core_mm:mat.core_mm, L_total:mat.L_total });
      }else if(typedText){
        materials.push({ position:slot.label, materialName:typedText, type:TYPE_KO[slot.type], t_um:null, core_mm:slot.type==='roll'?103:null, L_total:null });
      }
    });
    if(!materials.length){ alert('최소 하나의 위치에 자재를 선택해주세요.'); return; }
    if(existingPreset){
      existingPreset.name = name;
      existingPreset.materials = materials;
    }else{
      if(state.presets.some(p=>p.name===name) && !confirm(`"${name}" 이름이 이미 있습니다. 그래도 새 프리셋으로 추가할까요? (취소하면 저장 안 됨)`)) return;
      state.presets.push({ id:uid('preset'), name, materials });
    }
    saveState(); renderAll(); closeModal('presetBuilderModal');
    alert('제품 프리셋이 저장되었습니다.');
  };
}
function onSlotSearch(idx){
  presetSlotSelections[idx] = null;
  const q = $(`slotSearch_${idx}`).value.trim().toLowerCase();
  const results = $(`slotResults_${idx}`);
  if(!q){ results.innerHTML=''; return; }
  const slot = ITEM_PRESETS[idx];
  const candidates = state.materialLibrary.filter(m=>m.type===slot.type && m.name.toLowerCase().includes(q)).slice(0,6);
  results.innerHTML = candidates.length
    ? candidates.map(m=>`<div class="ac-item" onclick="pickSlotMaterial(${idx}, '${m.id}')">${m.name}</div>`).join('')
    : '<div class="ac-item ac-empty">일치하는 자재 없음 (그대로 입력하면 새 자재로 저장)</div>';
}
function pickSlotMaterial(idx, matId){
  const mat = state.materialLibrary.find(m=>m.id===matId);
  if(!mat) return;
  $(`slotSearch_${idx}`).value = mat.name;
  presetSlotSelections[idx] = { matId };
  $(`slotResults_${idx}`).innerHTML = '';
}

// ---- 항목 상세의 자재명 필드 자동완성 (자재 라이브러리 미리보기) ----
function onMatSearch(iid, type){
  const q = $(`mat_${iid}`).value.trim().toLowerCase();
  const results = $(`matResults_${iid}`);
  if(!results) return;
  if(!q){ results.innerHTML=''; return; }
  const candidates = state.materialLibrary.filter(m=>m.type===type && m.name.toLowerCase().includes(q)).slice(0,6);
  results.innerHTML = candidates.length
    ? candidates.map(m=>`<div class="ac-item" onclick="pickMatForItem('${iid}','${m.id}')">${m.name}${m.type==='roll'?` <span style="color:var(--text-dim);">(두께 ${m.t_um??'–'}µm · 지관 ${m.core_mm??'–'}mm)</span>`:''}</div>`).join('')
    : '<div class="ac-item ac-empty">일치하는 자재 없음 (그대로 입력하면 새 이름으로 저장)</div>';
}
function pickMatForItem(iid, matId){
  const mat = state.materialLibrary.find(m=>m.id===matId);
  if(!mat) return;
  $(`mat_${iid}`).value = mat.name;
  $(`matResults_${iid}`).innerHTML = '';
  if(mat.type==='roll'){
    if(mat.t_um!=null && $(`t_${iid}`)) $(`t_${iid}`).value = mat.t_um;
    if(mat.L_total!=null && $(`L_${iid}`)) $(`L_${iid}`).value = mat.L_total;
    if(mat.core_mm!=null){
      const mid = findMachineIdByItem_(iid);
      const pid = mid ? findProductIdByItem_(mid, iid) : null;
      const it = (mid && pid) ? findItem(mid, pid, iid) : null;
      if(it) it.core_mm = mat.core_mm;
      const btn103 = document.querySelector(`[data-act="core103"][data-i="${iid}"]`);
      const btn182 = document.querySelector(`[data-act="core182"][data-i="${iid}"]`);
      if(btn103 && btn182){
        if(mat.core_mm===103){ btn103.className='btn btn-blue'; btn182.className='btn btn-ghost'; }
        else if(mat.core_mm===182){ btn182.className='btn btn-blue'; btn103.className='btn btn-ghost'; }
      }
    }
  }
}

// ---- 클릭 위임 ----
document.addEventListener('input', (e)=>{
  if(e.target.dataset && e.target.dataset.act==='linkpreview'){
    const iid = e.target.dataset.i;
    const mid = findMachineIdByItem_(iid);
    if(!mid) return;
    const it = findItem(mid, findProductIdByItem_(mid, iid), iid);
    if(!it) return;
    const t = parseFloat($(`t_${iid}`).value);
    const L = parseFloat($(`L_${iid}`).value);
    const H = parseFloat($(`H_${iid}`).value);
    const LpreviewText = $(`LpreviewText_${iid}`);
    const HpreviewText = $(`HpreviewText_${iid}`);
    const LapplyBtn = $(`LapplyBtn_${iid}`);
    const HapplyBtn = $(`HapplyBtn_${iid}`);
    if(LpreviewText){
      const predH = H_fromLength(it.core_mm, t, L);
      LpreviewText.textContent = predH!=null ? `예상 쌓인두께: ${predH.toFixed(1)}mm` : '–';
      if(LapplyBtn){ LapplyBtn.disabled = predH==null; LapplyBtn.dataset.value = predH!=null ? predH.toFixed(1) : ''; }
    }
    if(HpreviewText){
      const predL = rollRemainingM(it.core_mm, t, H);
      HpreviewText.textContent = predL!=null ? `예상 초기총길이: ${predL.toLocaleString(undefined,{maximumFractionDigits:1})}m` : '–';
      if(HapplyBtn){ HapplyBtn.disabled = predL==null; HapplyBtn.dataset.value = predL!=null ? predL.toFixed(1) : ''; }
    }
  }
});
function applyLinkPreview(iid, target){
  if(target==='H'){
    const btn = $(`LapplyBtn_${iid}`);
    if(!btn || !btn.dataset.value) return;
    $(`H_${iid}`).value = btn.dataset.value;
    $(`H_${iid}`).dispatchEvent(new Event('input', {bubbles:true}));
  }else{
    const btn = $(`HapplyBtn_${iid}`);
    if(!btn || !btn.dataset.value) return;
    $(`L_${iid}`).value = btn.dataset.value;
    $(`L_${iid}`).dispatchEvent(new Event('input', {bubbles:true}));
  }
}
function findMachineIdByItem_(iid){
  for(const m of state.machines){ for(const p of m.products){ if(p.items.some(i=>i.id===iid)) return m.id; } }
  return null;
}
function findProductIdByItem_(mid, iid){
  const m = findMachine(mid);
  for(const p of m.products){ if(p.items.some(i=>i.id===iid)) return p.id; }
  return null;
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button, .preset-item, .item-btn, .machine-summary-header');
  if(!btn) return;
  const act = btn.dataset.act;
  if(!act) return;
  const mid = btn.dataset.m, pid = btn.dataset.p, iid = btn.dataset.i, hid = btn.dataset.h;

  if(act==='togglesummarymachine'){
    const header = e.target.closest('.machine-summary-header');
    const body = header.nextElementSibling;
    const currentlyOpen = body.classList.contains('open');
    summaryOverride[mid] = !currentlyOpen;
    renderSummary();
  }
  else if(act==='quickdelcp'){
    const it = findItem(mid, pid, iid);
    const cpid = btn.dataset.cp;
    it.checkpoints = it.checkpoints.filter(c=>c.id!==cpid);
    saveState(); renderAll();
  }
  else if(act==='openitemreplace'){
    renderItemModal(mid, pid, iid);
    openModal('itemModal');
    setTimeout(()=>{
      const box = $(`replaceBox_${iid}`);
      if(box) box.scrollIntoView({behavior:'smooth', block:'start'});
    }, 150);
  }
  else if(act==='togglepause'){
    e.stopPropagation();
    const m = findMachine(mid);
    if(!m.paused){ m.paused=true; m.pausedAt=Date.now(); }
    else{
      const pauseDuration = Date.now() - (m.pausedAt || Date.now());
      m.products.forEach(p=>p.items.forEach(it=>{
        if(it.type==='roll'){
          if(it.rollTarget) it.rollTarget += pauseDuration;
          it.checkpoints.forEach(cp=>cp.target += pauseDuration);
        }else if(it.type==='container'){ if(it.target) it.target += pauseDuration; }
      }));
      m.paused=false; m.pausedAt=null;
    }
    saveState(); renderAll();
  }
  else if(act==='addproduct'){ renderProductModalPresetList(mid); openModal('productModal'); }
  else if(act==='openlotmodal'){
    const m = findMachine(mid);
    $('lotModalBody').innerHTML = `
      <div class="input-group"><label class="input-label">로트번호</label><input type="text" id="lotnum_${pid}" value="${nextLotNumber(m)}"></div>
      <div class="input-group"><label class="input-label">이번 로트 권취 길이 (m)</label><input type="number" id="lotamt_${pid}" placeholder=""></div>
      <div class="input-group"><label class="input-label">특이사항 (선택)</label><input type="text" id="lotnote_${pid}" placeholder="예: 지관 변경, 재생원단 등"></div>
      <button class="btn btn-blue" data-act="recordlot" data-m="${mid}" data-p="${pid}">✓ 로트 완료 기록</button>
    `;
    openModal('lotModal');
  }
  else if(act==='pickpreset'){ renderProductModalConfirm(mid, btn.dataset.preset); }
  else if(act==='customproduct'){ renderProductModalConfirm(mid, null); }
  else if(act==='additem'){
    const grid = $('presetItemGrid');
    grid.innerHTML = ITEM_PRESETS.map((p,idx)=>`
      <button class="item-btn" data-act="addpresetitem" data-m="${mid}" data-p="${pid}" data-preset="${idx}" style="border:1.5px solid var(--line); cursor:pointer;">
        <div class="item-btn-name">${p.label}</div>
        <div class="item-btn-info">${TYPE_KO[p.type]}</div>
      </button>`).join('');
    $('customItemBtn').onclick = ()=>{
      const label = prompt('항목 이름을 입력하세요');
      if(label===null || !label.trim()) return;
      const type = confirm('점착제통인가요? (취소하면 다음 선택)') ? 'container' : (confirm('원단롤인가요? (취소하면 기타/메모형)') ? 'roll' : 'other');
      findProduct(mid, pid).items.push(defaultItem(type, label.trim()));
      saveState(); renderAll(); closeModal('addItemModal');
    };
    openModal('addItemModal');
  }
  else if(act==='addpresetitem'){
    const preset = ITEM_PRESETS[parseInt(btn.dataset.preset)];
    findProduct(mid, pid).items.push(defaultItem(preset.type, preset.label));
    saveState(); renderAll(); closeModal('addItemModal');
  }
  else if(act==='openitem'){ renderItemModal(mid, pid, iid); openModal('itemModal'); }
  else if(act==='replaceroll'){
    const it = findItem(mid, pid, iid);
    const prod = findProduct(mid, pid);
    captureRollFieldsInProgress(it, iid);
    const len = parseFloat($(`replaceLen_${iid}`).value);
    const matLot = $(`replaceMatLot_${iid}`).value.trim();
    const note = $(`replaceNote_${iid}`).value.trim();
    if(!(len>0)){ alert('새 원단 길이(m)를 입력해주세요.'); return; }
    if(!(it.t_um>0) || !(it.core_mm>0)){ alert('원단 두께와 지관 크기를 먼저 확인해주세요.'); return; }
    // 교체 전, 이전 원단에서 실제로 사용한 길이 계산 (끝까지 썼든 잔량 남기고 교체했든)
    const prevLiveRemain = liveRemainM(it, Date.now(), prod.speed);
    const usedAmount = (it.L_total!=null && !isNaN(it.L_total) && prevLiveRemain!=null && !isNaN(prevLiveRemain)) ? Math.max(0, it.L_total - prevLiveRemain) : null;
    prod.histories.push({
      id:uid('h'), type:'replace', label:it.label, materialName:it.materialName,
      amount: usedAmount!=null ? usedAmount.toLocaleString(undefined,{maximumFractionDigits:1})+'m 사용' : '',
      matLot, note, time:Date.now()
    });
    it.L_total = len;
    it.H = Math.round(H_fromLength(it.core_mm, it.t_um, len) * 10) / 10;
    it.rollRemainM = len;
    it.rollTarget = (prod.speed>0) ? Date.now() + (len/prod.speed)*60000 : null;
    it.checkpoints = [];
    it.materialLotNumber = matLot;
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='replacecontainer'){
    const it = findItem(mid, pid, iid);
    it.materialName = $(`mat_${iid}`).value.trim();
    const h = parseFloat($(`replaceContH_${iid}`).value);
    const note = $(`replaceContNote_${iid}`).value.trim();
    if(h>0){ it.curH = h; }
    it.target = null;
    findProduct(mid, pid).histories.push({ id:uid('h'), type:'replace', label:it.label, materialName:it.materialName, amount:h>0?h+'mm':'', note, time:Date.now() });
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='calcroll'){
    const it = findItem(mid, pid, iid);
    const prod = findProduct(mid, pid);
    it.materialName = $(`mat_${iid}`).value.trim();
    const t_um = parseFloat($(`t_${iid}`).value);
    const L_total = parseFloat($(`L_${iid}`).value);
    const H = parseFloat($(`H_${iid}`).value);
    if(!(t_um>0) || !(H>=0)){ alert('값을 확인해주세요.'); return; }
    if(!(prod.speed>0)){ alert('제품의 생산속도가 설정되어 있지 않습니다. 제품 상세에서 먼저 설정해주세요.'); return; }
    it.t_um=t_um; it.H=H;
    it.L_total = (L_total>0) ? L_total : null;
    const remainM = rollRemainingM(it.core_mm, t_um, H);
    it.rollRemainM=remainM;
    it.rollTarget = Date.now() + (remainM/prod.speed)*60000;
    recomputeCheckpoints(it, prod.speed);
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='recordlot'){
    const p = findProduct(mid, pid);
    const lotNumber = $(`lotnum_${pid}`).value.trim();
    const amount = parseFloat($(`lotamt_${pid}`).value);
    const note = $(`lotnote_${pid}`).value.trim();
    if(!lotNumber){ alert('로트번호를 확인해주세요.'); return; }
    if(!(amount>0)){ alert('권취 길이를 입력해주세요.'); return; }
    p.histories.push({ id:uid('h'), type:'lot', label:p.name, lotNumber, amount:amount+'m', note, time:Date.now() });
    saveState(); renderAll(); closeModal('lotModal');
  }
  else if(act==='calccontainer'){
    const it = findItem(mid, pid, iid);
    it.materialName = $(`mat_${iid}`).value.trim();
    const curH = parseFloat($(`curH_${iid}`).value);
    const rate = parseFloat($(`rate_${iid}`).value);
    const minH = parseFloat($(`minH_${iid}`).value);
    if(!(curH>=0) || !(rate>0) || !(minH>=0)){ alert('값을 확인해주세요.'); return; }
    it.curH=curH; it.rate=rate; it.minH=minH;
    const remainH = Math.max(0, curH-minH);
    it.target = Date.now() + (remainH/rate)*3600000;
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='calcrate'){
    const prevH = parseFloat($(`prevH_${iid}`).value);
    const elapsed = parseFloat($(`elapsedH_${iid}`).value);
    const nowH = parseFloat($(`nowH_${iid}`).value);
    if(!(prevH>=0) || !(elapsed>0) || !(nowH>=0) || nowH>prevH){ alert('값을 확인해주세요.'); return; }
    $(`rate_${iid}`).value = ((prevH-nowH)/elapsed).toFixed(2);
    $(`curH_${iid}`).value = nowH;
  }
  else if(act==='savenote'){
    const it = findItem(mid, pid, iid);
    it.materialName = $(`mat_${iid}`).value.trim();
    it.note = $(`note_${iid}`).value.trim();
    saveState(); renderAll(); closeModal('itemModal');
  }
  else if(act==='endproduct'){
    if(confirm('이 제품의 생산을 완료하시겠습니까?')){
      const p = findProduct(mid, pid);
      p.active = false; p.endedAt = Date.now();
      p.histories.push({ id:uid('h'), type:'end', label:p.name, amount:'완료', time:Date.now() });
      saveState(); renderAll();
    }
  }
  else if(act==='edithist'){
    const p = findProduct(mid, pid);
    const h = p.histories.find(hh=>hh.id===hid);
    if(!h) return;
    const newAmount = prompt('수정할 수량을 입력하세요', h.amount);
    if(newAmount===null) return;
    const d = new Date(h.time);
    const defaultTimeStr = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    const newTimeStr = prompt('시간을 수정하세요 (YYYY-MM-DD HH:MM)', defaultTimeStr);
    if(newTimeStr===null) return;
    if(newAmount.trim()) h.amount = newAmount.trim();
    const parsed = new Date(newTimeStr.trim().replace(' ','T'));
    if(!isNaN(parsed.getTime())) h.time = parsed.getTime();
    else alert('시간 형식을 확인 못해 시간은 반영되지 않았습니다 (수량만 반영됨).');
    saveState(); renderAll();
  }
  else if(act==='delhist'){
    if(confirm('이 이력을 삭제하시겠습니까?')){
      const p = findProduct(mid, pid);
      p.histories = p.histories.filter(h=>h.id!==hid);
      saveState(); renderAll();
    }
  }
  else if(act==='delmaterial'){
    const matId = btn.dataset.mat;
    if(confirm('이 자재를 라이브러리에서 삭제하시겠습니까? (이미 사용 중인 제품 프리셋에는 영향 없음)')){
      state.materialLibrary = state.materialLibrary.filter(m=>m.id!==matId);
      saveState(); renderAll();
    }
  }
  else if(act==='editmaterial'){
    renderMaterialModal(btn.dataset.mat);
    openModal('materialModal');
  }
  else if(act==='editpreset'){
    renderPresetBuilderModal(btn.dataset.preset);
    openModal('presetBuilderModal');
  }
  else if(act==='delpreset'){
    const presetId = btn.dataset.preset;
    if(confirm('이 제품 프리셋을 삭제하시겠습니까? (이미 생성된 제품에는 영향 없음)')){
      state.presets = state.presets.filter(p=>p.id!==presetId);
      saveState(); renderAll();
    }
  }
  else if(act==='setlotcode'){
    const m = findMachine(mid);
    const code = prompt('이 기계의 로트코드를 입력하세요 (예: C14)', m.lotCode||'');
    if(code!==null){ m.lotCode = code.trim(); saveState(); renderAll(); }
  }
  else if(act==='renamemachine'){
    const m = findMachine(mid);
    const name = prompt('기계 번호를 입력하세요', m.no);
    if(name!==null && name.trim()){ m.no = name.trim(); saveState(); renderAll(); }
  }
  else if(act==='delmachine'){
    e.stopPropagation();
    if(confirm('이 기계를 삭제할까요?')){ state.machines=state.machines.filter(m=>m.id!==mid); saveState(); renderAll(); }
  }
  else if(act==='core103' || act==='core182'){
    const it = findItem(mid, pid, iid);
    captureRollFieldsInProgress(it, iid);
    it.core_mm = act==='core103' ? 103 : 182;
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='addcp'){
    const it = findItem(mid, pid, iid);
    const prod = findProduct(mid, pid);
    captureRollFieldsInProgress(it, iid);
    const label = $(`cplabel_${iid}`).value.trim();
    const H_cp = parseFloat($(`cpH_${iid}`).value);
    if(!label){ alert('이름을 입력해주세요.'); return; }
    if(!(H_cp>=0) || H_cp >= it.H){ alert('높이값을 확인해주세요.'); return; }
    if(!(prod.speed>0)){ alert('제품의 생산속도가 설정되어 있지 않습니다.'); return; }
    const dist = distanceToCheckpoint(it, H_cp);
    it.checkpoints.push({ id:uid('cp'), label, H_cp, distM:dist, target:Date.now()+(dist/prod.speed)*60000, invalid:false });
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='editcp'){
    const cpid = btn.dataset.cp;
    const it = findItem(mid, pid, iid);
    const prod = findProduct(mid, pid);
    const cp = it.checkpoints.find(c=>c.id===cpid);
    if(!cp) return;
    const newLabel = prompt('이음매 이름', cp.label);
    if(newLabel===null) return;
    const newH = prompt('지관부터 쌓인 높이(mm)', cp.H_cp);
    if(newH===null) return;
    const H_cp = parseFloat(newH);
    if(!(H_cp>=0) || H_cp >= it.H){ alert('높이값을 확인해주세요.'); return; }
    cp.label = newLabel.trim() || cp.label;
    cp.H_cp = H_cp;
    const dist = distanceToCheckpoint(it, H_cp);
    cp.distM = dist; cp.target = Date.now()+(dist/prod.speed)*60000; cp.invalid = false;
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
  else if(act==='delcp'){
    const cpid = btn.dataset.cp;
    const it = findItem(mid, pid, iid);
    it.checkpoints = it.checkpoints.filter(c=>c.id!==cpid);
    saveState(); renderAll(); renderItemModal(mid, pid, iid);
  }
});

$('add-machine').addEventListener('click', ()=>{
  const no = prompt('기계 번호를 입력하세요 (예: 22호기)');
  if(no===null) return;
  state.machines.push(defaultMachine(no.trim() || '새 기계'));
  saveState(); renderAll();
});

function tick(){ renderSummary(); }

renderAll();
setInterval(tick, 1000);
  </script>
</body>
</html>
