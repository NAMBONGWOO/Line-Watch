<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>라인워치</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e8c">
<style>
  :root{
    --bg:#e9edf1;
    --card:#ffffff;
    --card2:#f4f6f8;
    --line:#dde3e9;
    --blue:#1f4e8c;
    --blue-bright:#2f6fc4;
    --text:#1c2530;
    --text-dim:#6b7684;
    --warn:#d6483f;
    --amber:#e0a417;
    --ok:#3f8f5f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:18px 14px 50px;
    background: linear-gradient(180deg,#f7f9fb 0%, var(--bg) 220px);
    color:var(--text);
    font-family:'Segoe UI','Pretendard',-apple-system,sans-serif;
    max-width:480px; margin-left:auto; margin-right:auto;
  }
  .eyebrow{ font-size:.72rem; letter-spacing:.18em; color:var(--blue); text-transform:uppercase; font-weight:800; margin-bottom:4px; }
  h1{ font-size:1.4rem; margin:0 0 16px; font-weight:800; letter-spacing:-.01em; color:var(--text); }
  .card{
    background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px;
    box-shadow:0 1px 3px rgba(30,50,80,.06);
  }
  .card h2{ font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:0 0 12px; font-weight:800; }

  #auth-card{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #auth-card input{ flex:1; min-width:120px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  #auth-card .btn{ width:auto; padding:10px 16px; }
  .auth-status{ font-size:.8rem; color:var(--text-dim); font-weight:700; }
  .auth-status.on{ color:var(--ok); }

  .sum-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 12px; border-radius:9px; margin-bottom:7px;
    background:var(--card2); border:1px solid var(--line);
  }
  .sum-row.urgent{ border-color:rgba(214,72,63,.5); background:rgba(214,72,63,.07); }
  .sum-row.soon{ border-color:rgba(224,164,23,.5); background:rgba(224,164,23,.08); }
  .sum-row.paused{ opacity:.65; border-style:dashed; }
  .sum-left .name{ font-size:.9rem; font-weight:800; }
  .sum-left .kind{ font-size:.74rem; color:var(--text-dim); margin-top:1px; }
  .sum-time{ font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:800; font-size:1.05rem; text-align:right; white-space:nowrap; }
  .sum-time.urgent{ color:var(--warn); }
  .sum-time.soon{ color:#b3820f; }
  .sum-time.ok{ color:var(--ok); }
  .sum-time.paused{ color:var(--text-dim); font-size:.85rem; }
  .empty-msg{ color:var(--text-dim); font-size:.85rem; text-align:center; padding:10px 0; }

  details.machine{
    background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    margin-bottom:10px; overflow:hidden;
    box-shadow:0 1px 3px rgba(30,50,80,.06);
  }
  details.machine > summary{
    list-style:none; cursor:pointer; padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800; font-size:1rem; background:linear-gradient(180deg,#f8fafc,#eef2f6);
  }
  details.machine > summary::-webkit-details-marker{ display:none; }
  .m-name-group{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .m-name-label{ font-weight:800; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pause-icon-btn{
    flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:#fff; color:var(--blue); font-size:.85rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .pause-icon-btn.is-paused{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .pause-badge{ font-size:.68rem; font-weight:700; color:#8a6d1a; background:#fbeecb; border:1px solid #f0d998; border-radius:20px; padding:2px 8px; white-space:nowrap; }
  .arrow{ color:var(--text-dim); font-size:.8rem; transition:transform .15s; margin-left:8px; flex-shrink:0; }
  details.machine[open] > summary .arrow{ transform:rotate(90deg); }
  .machine-body{ padding:12px 14px 14px; background:var(--card); }

  .product-header{ padding:10px 12px; background:#f9fafb; border-radius:8px; margin-bottom:12px; border:1px solid var(--line); }
  .product-title{ font-weight:800; font-size:.95rem; margin-bottom:2px; }
  .product-status{ font-size:.72rem; color:var(--text-dim); }

  .section-label{ font-size:.74rem; color:var(--text-dim); margin:10px 0 7px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .item-btn{
    padding:12px; border-radius:8px; border:1.5px solid;
    cursor:pointer; background:#e5edf9; border-color:#2f6fc4;
    text-align:center; transition:all .2s;
  }
  .item-btn.soon{ background:#fef8e6; border-color:var(--amber); }
  .item-btn.urgent{ background:#fce5e5; border-color:var(--warn); }
  .item-btn-name{ font-size:.85rem; font-weight:700; color:var(--text); margin-bottom:4px; }
  .item-btn-info{ font-size:.72rem; color:var(--text-dim); line-height:1.3; }
  .item-btn.urgent .item-btn-info{ color:var(--warn); font-weight:600; }
  .item-btn.soon .item-btn-info{ color:#b3820f; font-weight:600; }

  .btn-add{ background:transparent; color:var(--blue); border:1.5px dashed var(--blue); border-radius:10px; padding:11px; width:100%; font-weight:800; cursor:pointer; font-size:.86rem; margin-bottom:10px;}
  .btn{ padding:10px; border:0; border-radius:8px; font-weight:800; cursor:pointer; font-size:.84rem; }
  .btn-blue{ background:linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff; width:100%; }
  .btn-ghost{ background:#fff; color:var(--text-dim); border:1px solid var(--line); }
  .card-footer-actions{ display:flex; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); justify-content:flex-end; }
  .mini-btn{ padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--text-dim); font-size:.74rem; font-weight:700; cursor:pointer; }
  .mini-btn-warn{ color:var(--warn); border-color:rgba(214,72,63,.35); }

  .modal-overlay{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.show{ display:flex; }
  .modal{ background:var(--card); border-radius:12px; width:90%; max-width:340px; max-height:80vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .modal-header{ background:linear-gradient(180deg,var(--blue-bright),var(--blue)); color:#fff; padding:14px 16px; font-weight:700; font-size:.9rem; border-radius:12px 12px 0 0; }
  .modal-body{ padding:16px; }
  .input-group{ margin-bottom:12px; }
  .input-label{ display:block; font-size:.72rem; color:var(--text-dim); margin-bottom:4px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  input[type=number], input[type=text], select{ width:100%; padding:10px; background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:.92rem; font-variant-numeric:tabular-nums; }
  input:focus, select:focus{ outline:none; border-color:var(--blue); }
  .result-box{ background:#e5edf9; padding:10px; border-radius:8px; margin:10px 0; font-size:.75rem; color:var(--blue); font-weight:700; line-height:1.5; }
  .modal-buttons{ display:flex; gap:8px; margin-top:12px; }
  .modal-buttons .btn{ flex:1; padding:10px; }
  .history-list{ margin-top:10px; max-height:200px; overflow-y:auto; }
  .history-item{ padding:8px; background:var(--card2); border-radius:6px; margin-bottom:6px; font-size:.75rem; display:flex; justify-content:space-between; align-items:center; }
  .history-text{ flex:1; }
  .history-actions{ display:flex; gap:4px; }
  .history-btn{ padding:2px 6px; font-size:.65rem; border:0; border-radius:4px; cursor:pointer; background:transparent; color:var(--text-dim); }
</style>
</head>
<body>

  <div class="eyebrow">Production Line Monitor</div>
  <h1>라인워치</h1>

  <div class="card" id="auth-card">
    <div id="auth-logged-out" style="display:flex; gap:8px; flex:1; flex-wrap:wrap;">
      <input type="email" id="login-email" placeholder="이메일">
      <input type="password" id="login-pw" placeholder="비밀번호">
      <button class="btn btn-blue" id="login-btn">로그인</button>
    </div>
    <div id="auth-logged-in" style="display:none; align-items:center; gap:10px;">
      <span class="auth-status on">✓ 입력 가능 모드</span>
      <button class="btn btn-ghost" id="logout-btn">로그아웃</button>
    </div>
  </div>

  <div class="card">
    <h2>지금 확인할 순서</h2>
    <div id="summary-list"><div class="empty-msg">기계와 제품을 추가하고 계산하면 여기에 표시됩니다</div></div>
  </div>

  <div id="machines-container"></div>
  <button class="btn-add" id="add-machine">+ 기계 추가</button>

  <!-- 항목 추가 모달 (고정 명칭 선택) -->
  <div class="modal-overlay" id="addItemModal">
    <div class="modal">
      <div class="modal-header">항목 추가</div>
      <div class="modal-body">
        <div class="section-label">자주 쓰는 이름</div>
        <div class="item-grid" id="presetItemGrid" style="grid-template-columns:1fr 1fr;"></div>
        <button class="btn-add" id="customItemBtn" style="margin-top:4px;">+ 직접 입력</button>
        <button class="btn btn-ghost" style="width:100%;" onclick="closeModal('addItemModal')">취소</button>
      </div>
    </div>
  </div>

  <!-- 제품 추가 모달 -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">신규 제품 추가</div>
      <div class="modal-body">
        <div class="input-group">
          <label class="input-label">제품명</label>
          <input type="text" id="productName" placeholder="예: A제품, B제품">
        </div>
        <div class="modal-buttons">
          <button class="btn btn-blue" id="createProductBtn">추가</button>
          <button class="btn btn-ghost" onclick="closeModal('productModal')">취소</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 항목 상세 모달 -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <div class="modal-header" id="itemModalTitle">항목 상세</div>
      <div class="modal-body" id="itemModalBody"></div>
    </div>
  </div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsGIh79ZHulWJpt_aHPEgHtmgDWUFPMsE",
      authDomain: "line-watch-b0060.firebaseapp.com",
      projectId: "line-watch-b0060",
      storageBucket: "line-watch-b0060.firebasestorage.app",
      messagingSenderId: "61330552182",
      appId: "1:61330552182:web:3fc85c6ad0845f7f7c3657"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const STATE_DOC = db.collection('linewatch').doc('state');
  </script>

  <script>
const STORAGE_KEY = 'linewatch_v2';
const $ = (id) => document.getElementById(id);
const uid = (p) => p + Date.now() + Math.random().toString(36).slice(2,6);

const ITEM_PRESETS = [
  { label:'뚜껑', type:'roll' },
  { label:'바닥', type:'roll' },
  { label:'이형지', type:'roll' },
  { label:'기재', type:'roll' },
  { label:'점착제', type:'container' },
];

function defaultItem(type, label){
  if(type==='roll'){
    return { id:uid('it'), type, label, core_mm:103, t_um:12, L_total:6100, H:30, speed:50, rollTarget:null, rollRemainM:null, checkpoints:[] };
  }else{
    return { id:uid('it'), type, label, curH:null, rate:null, minH:50, target:null };
  }
}
function defaultProduct(name){
  return { id:uid('p'), name, items:[], histories:[], active:true, endedAt:null };
}
function defaultMachine(no){
  return { id:uid('m'), no, paused:false, pausedAt:null, products:[] };
}

function migrateState(s){
  if(!s || !s.machines) return { machines: [] };
  s.machines.forEach(m=>{
    if(!m.products){
      const legacyItems = m.items || [];
      m.products = legacyItems.length ? [{ id:uid('p'), name:'기존 데이터', items:legacyItems, histories:[], active:true, endedAt:null }] : [];
      delete m.items;
    }
    if(m.paused===undefined) m.paused=false;
    if(m.pausedAt===undefined) m.pausedAt=null;
  });
  return s;
}

let state = { machines:[] };
let firestoreReady = false;

(function loadLocalCache(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) state = migrateState(JSON.parse(raw)); }catch(e){}
})();

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(firestoreReady){
    STATE_DOC.set(state).catch(err=>console.error('Firestore 저장 실패:', err));
  }
}

STATE_DOC.onSnapshot((doc)=>{
  firestoreReady = true;
  if(doc.exists) state = migrateState(doc.data());
  else STATE_DOC.set(state).catch(err=>console.error('Firestore 초기화 실패:', err));
  renderAll();
}, (err)=>console.error('Firestore 연결 오류:', err));

auth.onAuthStateChanged((user)=>{
  const loggedIn = !!user;
  document.body.classList.toggle('readonly', !loggedIn);
  $('auth-logged-out').style.display = loggedIn ? 'none' : 'flex';
  $('auth-logged-in').style.display = loggedIn ? 'flex' : 'none';
});
$('login-btn').addEventListener('click', ()=>{
  const email = $('login-email').value.trim();
  const pw = $('login-pw').value;
  if(!email || !pw){ alert('이메일과 비밀번호를 입력하세요.'); return; }
  auth.signInWithEmailAndPassword(email, pw)
    .then(()=>{ $('login-pw').value=''; })
    .catch(err=>alert('로그인 실패: '+err.message));
});
$('logout-btn').addEventListener('click', ()=>auth.signOut());

// ---- 헬퍼 함수 ----
function findMachine(mid){ return state.machines.find(m=>m.id===mid); }
function findProduct(mid, pid){ return findMachine(mid).products.find(p=>p.id===pid); }
function findItem(mid, pid, iid){ return findProduct(mid, pid).items.find(i=>i.id===iid); }
function findMachineIdByProduct(pid){ const m=state.machines.find(m=>m.products.some(p=>p.id===pid)); return m?.id; }
function nowFor(m){ return (m && m.paused && m.pausedAt) ? m.pausedAt : Date.now(); }

function rollRemainingM(core_mm, t_um, H){
  if(!(t_um>0) || !(H>=0) || !(core_mm>0)) return null;
  const t_mm = t_um/1000, r0 = core_mm/2, R = r0+H;
  return Math.PI*(Math.pow(R,2)-Math.pow(r0,2)) / t_mm / 1000;
}
function fmtM(v){ return v==null ? '–' : v.toLocaleString(undefined,{maximumFractionDigits:1})+' m'; }
function liveRemainM(it, refNow){
  if(it.rollTarget==null || !(it.speed>0)) return null;
  return Math.max(0, (it.rollTarget-refNow)/60000*it.speed);
}
function fmtCountdown(targetMs, refNow, paused){
  refNow = refNow ?? Date.now();
  const diff = targetMs - refNow;
  const past = diff <= 0;
  const abs = Math.abs(diff);
  const totalSec = Math.floor(abs/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60);
  const sstr = h>0 ? `${h}시간 ${m}분` : `${m}분`;
  if(paused) return { text:'⏸ '+(past?'0분':sstr)+' 남음 (일시정지)', tier:'paused' };
  let tier = past ? 'urgent' : (diff < 10*60000 ? 'urgent' : (diff < 30*60000 ? 'soon' : 'ok'));
  return { text: past ? '지금 확인!' : sstr+' 후', tier };
}

function distanceToCheckpoint(it, H_cp){
  if(!(H_cp>=0) || H_cp >= it.H) return null;
  const t_mm = it.t_um/1000, r0 = it.core_mm/2;
  const R = r0+it.H, R_cp = r0+H_cp;
  return Math.PI*(Math.pow(R,2)-Math.pow(R_cp,2)) / t_mm / 1000;
}
function recomputeCheckpoints(it){
  const now = Date.now();
  it.checkpoints.forEach(cp=>{
    const dist = distanceToCheckpoint(it, cp.H_cp);
    if(dist===null){ cp.target=now; cp.distM=null; cp.invalid=true; }
    else{ cp.target = now + (dist/it.speed)*60000; cp.distM=dist; cp.invalid=false; }
  });
}

// ---- 모달 제어 ----
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }

// ---- 렌더링 ----
function machineHTML(m){
  const isOpen = !closedMachines.has(m.id);
  return `
  <details class="machine" ${isOpen?'open':''} id="det-${m.id}">
    <summary>
      <span class="m-name-group">
        <span class="m-name-label">${m.no}</span>
        <button class="pause-icon-btn ${m.paused?'is-paused':''}" data-act="togglepause" data-m="${m.id}" title="${m.paused?'가동 재개':'가동 일시정지'}" style="border:0;">${m.paused ? '▶' : '⏸'}</button>
        ${m.paused?'<span class="pause-badge">일시정지</span>':''}
      </span>
      <span class="arrow">▶</span>
    </summary>
    <div class="machine-body">
      <div id="products_${m.id}">${m.products.map(p=>productHTML(m,p)).join('')}</div>
      <button class="btn-add" data-act="addproduct" data-m="${m.id}">+ 신규 제품</button>
      <div class="card-footer-actions">
        <button class="mini-btn" data-act="renamemachine" data-m="${m.id}">이름 수정</button>
        <button class="mini-btn mini-btn-warn" data-act="delmachine" data-m="${m.id}">기계 삭제</button>
      </div>
    </div>
  </details>`;
}

function productHTML(m, p){
  const items = p.items.filter(i=>i.type==='roll');
  const containers = p.items.filter(i=>i.type==='container');
  return `
  <div class="product-header">
    <div class="product-title">${p.name}${p.active?'':' (종료)'}</div>
    <div class="product-status">${p.items.length}개 항목 · 생성 ${new Date(parseInt(p.id.slice(-13))).toLocaleString('ko-KR', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
  </div>
  
  ${items.length>0 ? `
    <div class="section-label">원단롤</div>
    <div class="item-grid">
      ${items.map(it=>{
        const refNow = nowFor(m);
        let tier = 'ok';
        if(it.rollTarget){
          const diff = it.rollTarget - refNow;
          if(diff < 10*60000) tier = 'urgent';
          else if(diff < 30*60000) tier = 'soon';
        }
        return `
          <button class="item-btn ${tier}" data-act="openitem" data-m="${m.id}" data-p="${p.id}" data-i="${it.id}" style="border:none; padding:0; cursor:pointer;">
            <div class="item-btn-name">${it.label}</div>
            <div class="item-btn-info">${it.rollTarget ? fmtM(liveRemainM(it, refNow)) + '<br>' + fmtCountdown(it.rollTarget, refNow, m.paused).text : '미계산'}</div>
          </button>`;
      }).join('')}
    </div>
  ` : ''}
  
  ${containers.length>0 ? `
    <div class="section-label">점착제통</div>
    <div class="item-grid">
      ${containers.map(it=>{
        const refNow = nowFor(m);
        let tier = 'ok';
        if(it.target){
          const diff = it.target - refNow;
          if(diff < 10*60000) tier = 'urgent';
          else if(diff < 30*60000) tier = 'soon';
        }
        return `
          <button class="item-btn ${tier}" data-act="openitem" data-m="${m.id}" data-p="${p.id}" data-i="${it.id}" style="border:none; padding:0; cursor:pointer;">
            <div class="item-btn-name">${it.label}</div>
            <div class="item-btn-info">${it.target ? fmtCountdown(it.target, refNow, m.paused).text : '미계산'}</div>
          </button>`;
      }).join('')}
    </div>
  ` : ''}
  
  <button class="btn-add" data-act="additem" data-m="${m.id}" data-p="${p.id}" style="margin-bottom:0;">+ 항목 추가</button>
  
  <div class="section-label">생산 이력</div>
  <div class="history-list" id="hist_${p.id}"></div>
  
  ${p.active ? `<button class="btn btn-blue" style="margin-top:10px; width:100%;" data-act="endproduct" data-m="${m.id}" data-p="${p.id}">✓ 생산 완료</button>` : ''}
  
  <div style="margin-top:10px;"></div>`;
}

let closedMachines = new Set();

function renderMachines(){
  $('machines-container').innerHTML = state.machines.map(machineHTML).join('');
  document.querySelectorAll('details.machine').forEach(d=>{
    const mid = d.id.replace('det-','');
    d.addEventListener('toggle', ()=>{ d.open ? closedMachines.delete(mid) : closedMachines.add(mid); });
  });
}

function renderCpList(it, mid, refNow){
  const mid_for_list = mid; // closure capture
  return it.checkpoints.map(cp=>{
    const {text} = fmtCountdown(cp.target, refNow, findMachine(mid_for_list).paused);
    const distText = cp.invalid ? '확인 필요' : (cp.distM!=null ? `약 ${cp.distM.toLocaleString(undefined,{maximumFractionDigits:0})}m 남음` : '–');
    return `<div class="history-item">
      <div class="history-text"><strong>${cp.label}</strong><br>H ${cp.H_cp}mm · ${distText}</div>
      <div style="font-size:.75rem; color:var(--text-dim);">${text}</div>
    </div>`;
  }).join('');
}

function renderCpListInModal(it, mid){
  const refNow = nowFor(findMachine(mid));
  return renderCpList(it, mid, refNow);
}

function renderHistories(){
  state.machines.forEach(m=>{
    m.products.forEach(p=>{
      const el = $(`hist_${p.id}`);
      if(!el) return;
      el.innerHTML = p.histories.map(h=>`
        <div class="history-item">
          <div class="history-text">
            <strong>${h.type==='roll'?'원단교체': h.type==='container'?'약품교체':'생산'}</strong><br>
            ${h.label} · ${h.amount} · ${new Date(h.time).toLocaleTimeString('ko-KR')}
          </div>
          <div class="history-actions">
            <button class="history-btn" data-act="edithist" data-m="${m.id}" data-p="${p.id}" data-h="${h.id}">수정</button>
            <button class="history-btn" data-act="delhist" data-m="${m.id}" data-p="${p.id}" data-h="${h.id}">삭제</button>
          </div>
        </div>`).join('');
    });
  });
}

function renderSummary(){
  const entries = [];
  state.machines.forEach(m=>{
    m.products.filter(p=>p.active).forEach(p=>{
      const refNow = nowFor(m);
      p.items.forEach(it=>{
        if(it.type==='roll'){
          if(it.rollTarget) entries.push({name:`${m.no} · ${p.name} · ${it.label}`, kind:`롤 교체${it.rollRemainM!=null?' · 약 '+it.rollRemainM.toLocaleString(undefined,{maximumFractionDigits:0})+'m 남음':''}`, target:it.rollTarget, m});
          it.checkpoints.forEach(cp=>entries.push({name:`${m.no} · ${p.name} · ${it.label}`, kind:cp.label, target:cp.target, invalid:cp.invalid, m}));
        }else{
          if(it.target) entries.push({name:`${m.no} · ${p.name} · ${it.label}`, kind:'약품 교체', target:it.target, m});
        }
      });
    });
  });
  entries.sort((a,b)=>a.target-b.target);
  const el = $('summary-list');
  if(!entries.length){ el.innerHTML = '<div class="empty-msg">기계와 제품을 추가하고 계산하면 여기에 표시됩니다</div>'; return; }
  el.innerHTML = entries.map(en=>{
    let {text,tier} = fmtCountdown(en.target, nowFor(en.m), en.m.paused);
    if(en.invalid && !en.m.paused){ text='확인 필요'; tier='urgent'; }
    const tierClass = tier==='urgent'?'urgent':(tier==='soon'?'soon':(tier==='paused'?'paused':''));
    return `<div class="sum-row ${tierClass}">
      <div class="sum-left"><div class="name">${en.name}</div><div class="kind">${en.kind}</div></div>
      <div class="sum-time ${tier}">${text}</div>
    </div>`;
  }).join('');
}

function renderAll(){ renderMachines(); renderHistories(); renderSummary(); }

// ---- 액션 ----
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const act = btn.dataset.act;
  const mid = btn.dataset.m, pid = btn.dataset.p, iid = btn.dataset.i, hid = btn.dataset.h;
  
  if(act==='togglepause'){
    e.stopPropagation();
    const m = findMachine(mid);
    if(!m.paused){ m.paused=true; m.pausedAt=Date.now(); }
    else{
      const pauseDuration = Date.now() - (m.pausedAt || Date.now());
      m.products.forEach(p=>p.items.forEach(it=>{
        if(it.type==='roll'){
          if(it.rollTarget) it.rollTarget += pauseDuration;
          it.checkpoints.forEach(cp=>cp.target += pauseDuration);
        }else{ if(it.target) it.target += pauseDuration; }
      }));
      m.paused=false; m.pausedAt=null;
    }
    saveState(); renderAll();
  }
  else if(act==='addproduct'){
    $('productName').value = '';
    $('createProductBtn').onclick = ()=>{
      const name = $('productName').value.trim();
      if(!name){ alert('제품명을 입력하세요.'); return; }
      findMachine(mid).products.push(defaultProduct(name));
      saveState(); renderAll(); closeModal('productModal');
    };
    openModal('productModal');
  }
  else if(act==='additem'){
    const grid = $('presetItemGrid');
    grid.innerHTML = ITEM_PRESETS.map((p,idx)=>`
      <button class="item-btn" data-act="addpresetitem" data-m="${mid}" data-p="${pid}" data-preset="${idx}" style="border:1.5px solid var(--line); cursor:pointer;">
        <div class="item-btn-name">${p.label}</div>
        <div class="item-btn-info">${p.type==='roll'?'원단롤':'점착제통'}</div>
      </button>`).join('');
    $('customItemBtn').onclick = ()=>{
      const label = prompt('항목 이름을 입력하세요');
      if(label===null || !label.trim()) return;
      const type = confirm('점착제통인가요? (취소: 원단롤)') ? 'container' : 'roll';
      findProduct(mid, pid).items.push(defaultItem(type, label.trim()));
      saveState(); renderAll(); closeModal('addItemModal');
    };
    openModal('addItemModal');
  }
  else if(act==='addpresetitem'){
    const preset = ITEM_PRESETS[parseInt(btn.dataset.preset)];
    findProduct(mid, pid).items.push(defaultItem(preset.type, preset.label));
    saveState(); renderAll(); closeModal('addItemModal');
  }
  else if(act==='openitem'){
    const it = findItem(mid, pid, iid);
    const m = findMachine(mid);
    const refNow = nowFor(m);
    let modalBody = '';
    if(it.type==='roll'){
      const cpListHtml = it.checkpoints.length > 0 ? renderCpListInModal(it, mid) : '<div class="empty-msg" style="font-size:.75rem;">체크포인트 없음</div>';
      modalBody = `
        <div class="input-group"><label class="input-label">원단 두께 (µm)</label><input type="number" id="t_${iid}" value="${it.t_um??''}"></div>
        <div class="input-group"><label class="input-label">초기 총 길이 (m)</label><input type="number" id="L_${iid}" value="${it.L_total??''}"></div>
        <div class="input-group">
          <label class="input-label">지관 크기</label>
          <div style="display:flex; gap:6px;">
            <button class="btn ${it.core_mm===103?'btn-blue':'btn-ghost'}" data-act="core103" data-m="${mid}" data-p="${pid}" data-i="${iid}" style="flex:1; padding:8px;">103mm</button>
            <button class="btn ${it.core_mm===182?'btn-blue':'btn-ghost'}" data-act="core182" data-m="${mid}" data-p="${pid}" data-i="${iid}" style="flex:1; padding:8px;">182mm</button>
          </div>
        </div>
        <div class="input-group"><label class="input-label">쌓인 두께 H (mm)</label><input type="number" id="H_${iid}" value="${it.H??''}"></div>
        <div class="input-group"><label class="input-label">생산속도 (m/min)</label><input type="number" id="speed_${iid}" value="${it.speed??''}"></div>
        <button class="btn btn-blue" data-act="calcroll" data-m="${mid}" data-p="${pid}" data-i="${iid}">롤 계산 업데이트</button>
        ${it.rollTarget ? `<div class="result-box">예상 잔량: ${fmtM(liveRemainM(it, refNow))}<br>약 ${Math.floor((it.rollTarget-refNow)/60000)}분 후 교체</div>` : ''}
        <div class="section-label">체크포인트</div>
        <div class="history-list">${cpListHtml}</div>
        <input type="text" id="cplabel_${iid}" placeholder="이음매 이름" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; margin-top:10px;">
        <input type="number" id="cpH_${iid}" placeholder="높이(mm)" style="width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px;">
        <button class="btn btn-ghost" data-act="addcp" data-m="${mid}" data-p="${pid}" data-i="${iid}" style="width:100%;">+ 체크포인트 추가</button>
      `;
    }else{
      modalBody = `
        <div class="input-group"><label class="input-label">현재 높이 (mm)</label><input type="number" id="curH_${iid}" value="${it.curH??''}"></div>
        <div class="input-group"><label class="input-label">소모속도 (mm/시간)</label><input type="number" id="rate_${iid}" value="${it.rate??''}"></div>
        <div class="input-group"><label class="input-label">교체 기준 높이 (mm)</label><input type="number" id="minH_${iid}" value="${it.minH??50}"></div>
        <button class="btn btn-blue" data-act="calccontainer" data-m="${mid}" data-p="${pid}" data-i="${iid}">계산 업데이트</button>
        ${it.target ? `<div class="result-box">예상 교체까지<br>약 ${Math.floor((it.target-refNow)/3600000)}시간</div>` : ''}
      `;
    }
    $('itemModalTitle').textContent = findProduct(mid, pid).name + ' · ' + it.label;
    $('itemModalBody').innerHTML = modalBody + `
      <div class="modal-buttons" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="closeModal('itemModal')" style="width:100%;">닫기</button>
      </div>`;
    openModal('itemModal');
  }
  else if(act==='calcroll'){
    const it = findItem(mid, pid, iid);
    const t_um = parseFloat($(`t_${iid}`).value);
    const L_total = parseFloat($(`L_${iid}`).value);
    const H = parseFloat($(`H_${iid}`).value);
    const speed = parseFloat($(`speed_${iid}`).value);
    if(!(t_um>0) || !(H>=0) || !(speed>0)){ alert('값을 확인해주세요.'); return; }
    it.t_um=t_um; it.L_total=L_total; it.H=H; it.speed=speed;
    const remainM = rollRemainingM(it.core_mm, t_um, H);
    const remainMin = remainM/speed;
    it.rollRemainM=remainM;
    it.rollTarget = Date.now() + remainMin*60000;
    recomputeCheckpoints(it);
    
    // 원단 교체 이력 자동 기록
    findProduct(mid, pid).histories.push({
      id: uid('h'), type:'roll', label:it.label, amount:remainM.toLocaleString(undefined,{maximumFractionDigits:0})+'m', time:Date.now()
    });
    
    saveState(); renderAll();
  }
  else if(act==='calccontainer'){
    const it = findItem(mid, pid, iid);
    const curH = parseFloat($(`curH_${iid}`).value);
    const rate = parseFloat($(`rate_${iid}`).value);
    const minH = parseFloat($(`minH_${iid}`).value);
    if(!(curH>=0) || !(rate>0) || !(minH>=0)){ alert('값을 확인해주세요.'); return; }
    it.curH=curH; it.rate=rate; it.minH=minH;
    const remainH = Math.max(0, curH-minH);
    const remainHours = remainH/rate;
    it.target = Date.now() + remainHours*3600000;
    
    findProduct(mid, pid).histories.push({
      id: uid('h'), type:'container', label:it.label, amount:curH+'mm', time:Date.now()
    });
    
    saveState(); renderAll();
  }
  else if(act==='endproduct'){
    if(confirm('이 제품의 생산을 완료하시겠습니까?')){
      const p = findProduct(mid, pid);
      p.active = false;
      p.endedAt = Date.now();
      p.histories.push({
        id: uid('h'), type:'end', label:p.name, amount:'완료', time:Date.now()
      });
      saveState(); renderAll(); closeModal('itemModal');
    }
  }
  else if(act==='edithist'){
    const p = findProduct(mid, pid);
    const h = p.histories.find(hh=>hh.id===hid);
    if(!h) return;
    const newAmount = prompt('수정할 수량을 입력하세요', h.amount);
    if(newAmount!==null && newAmount.trim()){
      h.amount = newAmount.trim();
      saveState(); renderAll();
    }
  }
  else if(act==='delhist'){
    if(confirm('이 이력을 삭제하시겠습니까?')){
      const p = findProduct(mid, pid);
      p.histories = p.histories.filter(h=>h.id!==hid);
      saveState(); renderAll();
    }
  }
  else if(act==='renamemachine'){
    const m = findMachine(mid);
    const name = prompt('기계 번호를 입력하세요', m.no);
    if(name!==null && name.trim()){ m.no = name.trim(); saveState(); renderAll(); }
  }
  else if(act==='delmachine'){
    e.stopPropagation();
    if(confirm('이 기계를 삭제할까요?')){ state.machines=state.machines.filter(m=>m.id!==mid); saveState(); renderAll(); }
  }
  else if(act==='core103' || act==='core182'){
    const it = findItem(mid, pid, iid);
    it.core_mm = act==='core103' ? 103 : 182;
    saveState(); renderAll();
  }
  else if(act==='addcp'){
    const it = findItem(mid, pid, iid);
    const label = $(`cplabel_${iid}`).value.trim();
    const H_cp = parseFloat($(`cpH_${iid}`).value);
    if(!label){ alert('이름을 입력해주세요.'); return; }
    if(!(H_cp>=0) || H_cp >= it.H){ alert('높이값을 확인해주세요.'); return; }
    const dist = distanceToCheckpoint(it, H_cp);
    it.checkpoints.push({ id:uid('cp'), label, H_cp, distM:dist, target:Date.now()+(dist/it.speed)*60000, invalid:false });
    saveState(); renderAll();
  }
});

$('add-machine').addEventListener('click', ()=>{
  const no = prompt('기계 번호를 입력하세요 (예: 22호기)');
  if(no===null) return;
  state.machines.push(defaultMachine(no.trim() || '새 기계'));
  saveState(); renderAll();
});

function tick(){
  renderSummary();
  state.machines.forEach(m=>{
    const refNow = nowFor(m);
    m.products.forEach(p=>p.items.forEach(it=>{
      if(it.type==='roll'){
        it.checkpoints.forEach(cp=>{ const el=$(`cptime_${cp.id}`); if(el) el.textContent = fmtCountdown(cp.target, refNow, m.paused).text; });
      }
    }));
  });
}

renderAll();
setInterval(tick, 1000);
  </script>
</body>
</html>
