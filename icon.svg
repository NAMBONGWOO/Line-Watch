<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6fc4"/>
      <stop offset="100%" stop-color="#173a68"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- subtle inner highlight -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="white" opacity="0.04"/>

  <!-- gauge ring: amber base (full circle) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#e0a417" stroke-width="40"/>

  <!-- gauge ring: white progress arc (70%), starting at 12 o'clock -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="40"
          stroke-linecap="round"
          stroke-dasharray="659.7 942.5"
          transform="rotate(-90 256 256)"/>

  <!-- center hub -->
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>

  <!-- watch hand, pointing to the progress boundary (~252deg from 12 o'clock) -->
  <line x1="256" y1="256" x2="256" y2="132" stroke="#ffffff" stroke-width="12" stroke-linecap="round"
        transform="rotate(252 256 256)"/>
  <circle cx="256" cy="132" r="9" fill="#ffffff" transform="rotate(252 256 256)"/>
</svg>
